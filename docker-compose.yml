services:
  octapro-pg-container:
    image: postgres:15
    container_name: octapro-pg-container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: octapro_db
    ports:
      - "5437:5432"   # ← nova porta pra não conflitar com o Postgres existente
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  dev-env:
    build: ./
    container_name: dev-env
    depends_on:
      octapro-pg-container:
        condition: service_healthy   # aguarda o Postgres estar pronto de verdade
    ports:
      - "5091:5091"   # .NET API
      - "5173:5173"   # React dev server
    volumes:
      - "./:/app/backend"
      - "../octa-pro-frontend/:/app/frontend"
      - nuget_cache:/root/.nuget/packages   # cache dos pacotes NuGet entre rebuilds
      - node_modules_cache:/app/frontend/node_modules
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    # ↓ Obrigatório para o vsdbg funcionar (ptrace para attach de processo)
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    tty: true
    stdin_open: true

volumes:
  postgres_data:
  nuget_cache:
  node_modules_cache: